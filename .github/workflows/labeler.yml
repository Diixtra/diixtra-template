name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Broker-routed placement: ask the Diixtra actions-broker which runner
  # this job should use (cost-first, capacity-aware spill).
  # FAIL-OPEN: any error falls back to the hardcoded runner below -
  # worst case is the status quo.
  choose:
    permissions:
      # OIDC token exchange with the runner broker, required by the choose-runner reusable workflow
      id-token: write
    uses: Diixtra/diixtra-forge/.github/workflows/choose-runner.yml@main
    with:
      target: standard-ci
      size: small
      docker: false
      mode: live
      fallback: blacksmith-2vcpu-ubuntu-2404

  label:
    needs: choose
    runs-on: ${{ fromJSON(needs.choose.outputs.runs_on) }}
    steps:
      - uses: actions/labeler@v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
