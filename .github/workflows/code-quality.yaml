name: Code Quality

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write
  # Reusable code-quality.yaml declares `packages: read` for ts-quality
  # to fetch private @<scope>/* deps from npm.pkg.github.com (#1786).
  # Callers MUST mirror that scope, otherwise GitHub Actions rejects the
  # workflow_call with `startup_failure`.
  packages: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    uses: Diixtra/diixtra-forge/.github/workflows/code-quality.yaml@main
    with:
      mode: enforce
      runs-on: ${{ vars.CI_LOCAL_RUNNERS == 'true' && '["ci-light"]' || '["ubuntu-latest"]' }}
      # container: jobs (semgrep, trivy) need Docker — route them to the DinD pool
      # under local runners; ci-light has no Docker (forge #4010).
      runs-on-docker: ${{ vars.CI_LOCAL_RUNNERS == 'true' && '["ci-docker"]' || '["ubuntu-latest"]' }}
